name: Django check

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run manage.py check
        run: |
          set -o pipefail
          uv run python manage.py check 2>&1 | tee check-output.txt

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '(no output captured)';
            try { output = fs.readFileSync('check-output.txt', 'utf8'); } catch {}
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `manage.py check failed on main (${sha})`,
              body: [
                `\`python manage.py check\` failed for commit ${context.sha} pushed by @${context.actor}.`,
                '',
                `Workflow run: ${runUrl}`,
                '',
                '```',
                output.slice(-60000),
                '```',
              ].join('\n'),
            });
