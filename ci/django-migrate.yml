name: Django migrate (fresh db)

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Remove any committed database so migrate starts fresh
        run: rm -f db.sqlite3

      - name: Run migrate on a new database
        run: |
          set -o pipefail
          uv run python manage.py migrate --noinput 2>&1 | tee migrate-output.txt

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '(no output captured)';
            try { output = fs.readFileSync('migrate-output.txt', 'utf8'); } catch {}
            const sha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `migrate fails on a fresh database on ${branch} (${sha})`,
              body: [
                `\`python manage.py migrate\` against a new, empty database failed for commit ${context.sha} on \`${branch}\`, pushed by @${context.actor}.`,
                '',
                `Workflow run: ${runUrl}`,
                '',
                '```',
                output.slice(-60000),
                '```',
              ].join('\n'),
            });
