name: uv.lock check

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: read
  issues: write

jobs:
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Verify uv.lock matches pyproject.toml
        run: |
          set -o pipefail
          uv lock --check 2>&1 | tee lock-output.txt

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '(no output captured)';
            try { output = fs.readFileSync('lock-output.txt', 'utf8'); } catch {}
            const sha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `uv.lock out of date on ${branch} (${sha})`,
              body: [
                `Commit ${context.sha} on \`${branch}\`, pushed by @${context.actor}, changed \`pyproject.toml\` but \`uv.lock\` was not updated to match.`,
                '',
                'To fix, run `uv lock` locally and commit the updated `uv.lock`.',
                '',
                `Workflow run: ${runUrl}`,
                '',
                '```',
                output.slice(-60000),
                '```',
              ].join('\n'),
            });
